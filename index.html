<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome | WMSU Canteen Kiosk</title>
  <meta name="description" content="Western Mindanao State University Campus Canteen Self-Service Kiosk. Order dine-in or take-out across multiple stalls.">
  <link rel="icon" type="image/png" href="assets/img/wmsu-logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/tokens.css?v=24" rel="stylesheet">
  <link href="assets/css/style.css?v=24" rel="stylesheet">
</head>
<body class="kiosk-welcome">
  <main class="hero">
    <div class="container py-5" data-enter>
      <img class="logo-img xl mb-4" src="assets/img/wmsu-logo.png" width="108" height="108" alt="Western Mindanao State University seal" fetchpriority="high">
      <p class="text-wmsu fw-bold text-uppercase mb-2" style="letter-spacing:.14em;font-size:.82rem">Western Mindanao State University</p>
      <h1 class="serif-title mb-3" style="font-size:var(--fs-display)">Good Food, <em style="color:var(--accent)">Fresh From</em><br>Your Campus Canteen</h1>
      <p class="lead text-muted mx-auto mb-4" style="max-width:540px">Mix dishes from multiple campus stalls in one cart, choose Dine-In or Take-Out, and pay via Cash or automated GCash.</p>
      <div class="d-grid gap-3 mx-auto" style="max-width:380px">
        <a href="customer/vendors.html" class="btn btn-wmsu btn-lg"><i class="bi bi-basket2-fill" aria-hidden="true"></i> Start Ordering</a>
        <a href="customer/tracking.html" class="btn btn-outline-wmsu btn-lg"><i class="bi bi-geo-alt" aria-hidden="true"></i> Track My Order</a>
      </div>
    </div>
  </main>
</body>
</html>
